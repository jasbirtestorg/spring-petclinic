# database init, supports postgres too
database=postgres
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost/petclinic}
spring.datasource.username=${POSTGRES_USER:petclinic}
spring.datasource.password=${POSTGRES_PASS:petclinic}
# Schema/seed initialization. Defaults to "never" so a provisioned Cloud SQL instance is
# never re-DDL'd on boot. Set SQL_INIT_MODE=always for throwaway/first-boot environments
# (test containers, local bring-up); the SQL is idempotent (CREATE TABLE IF NOT EXISTS,
# ON CONFLICT DO NOTHING) so re-running is safe.
spring.sql.init.mode=${SQL_INIT_MODE:never}

# HikariCP connection pool.
# Pool sizing is deliberately small per pod and reasoned against the database, NOT
# inflated to mask saturation. Total DB connections = replicas * maximum-pool-size, plus
# headroom for ops/migrations. Example: Cloud SQL max_connections=400, reserve ~50 for
# ops -> ~350 usable; at 10 per pod that is a safe ceiling of ~35 pods. To scale further
# without raising max_connections, lower per-pod size or add a server-side pooler
# (PgBouncer). The Cloud SQL Auth Proxy is a transport shim, NOT a connection pool: it
# does not reduce the connection count the database sees.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
# Fixed-size pool (minimum-idle == maximum-pool-size) avoids latency spikes from ramping
# connections up under sudden load.
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
# Fail fast on saturation (2s) rather than hiding it behind a long wait.
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:2000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:1000}
# Recycle connections below typical server-side idle cutoffs / proxy behavior.
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE:120000}
# Surface connections held across non-DB work (potential leaks) after 30s.
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:30000}

# Kubernetes liveness/readiness probe support.
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.show-details=never

# Readiness reflects DB reachability so a pod with no database does not receive traffic.
# Liveness deliberately does NOT include the DB (a transient DB blip must not restart the
# pod); it uses livenessState only, mapped to /livez.
management.endpoint.health.group.readiness.include=readinessState,db
