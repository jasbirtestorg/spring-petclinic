# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Caching
# Native Caffeine (in-process) cache. The two vet caches are declared here; their
# bounds/TTL/stats come from the Caffeine builder bean in CacheConfiguration.
spring.cache.type=caffeine
spring.cache.cache-names=vets,vets_page

# Actuator
# Expose only the endpoints needed for health checks and observability. The set is
# overridable per environment via MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE. Do NOT
# expose "*" in production: that publishes env, heapdump, threaddump, etc.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
# Tag HTTP server metrics by route template (e.g. /owners/{ownerId}) rather than raw
# URL, so latency metrics stay bounded in cardinality and are correlatable per endpoint.
management.metrics.tags.application=petclinic

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
